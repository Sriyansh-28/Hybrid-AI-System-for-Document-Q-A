[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
# Cap uploads at 10 MB so the uploader advertises a realistic limit for the
# free-tier host (Streamlit's default of 200 MB is far beyond what a 512 MB
# instance can embed).
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4F8BF9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"
