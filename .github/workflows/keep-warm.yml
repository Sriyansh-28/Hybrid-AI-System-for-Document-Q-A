name: Keep app awake

# Streamlit Community Cloud puts an app to sleep after a stretch of no traffic.
# This workflow pings the deployed app on a schedule so it stays awake and
# visitors land directly on it instead of a "this app has gone to sleep" page.
#
# The app must be PUBLIC in its Streamlit Cloud sharing settings for this to
# work — a private app redirects the ping to a login page, which does not count
# as traffic.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch (main), so this takes effect once merged to main. Scheduled runs are
# best-effort and can lag a few minutes; every 5 minutes is far more frequent
# than Streamlit Cloud's sleep threshold needs, which gives generous margin.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allows manual runs from the Actions tab

env:
  APP_URL: https://hybrid-ai-system-for-document-q-a-sri.streamlit.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit app to keep it awake
        run: |
          # Streamlit Cloud runs an anonymous-session handshake (a short chain of
          # 303 redirects that set cookies) before serving a public app. A real
          # browser follows it automatically; so must the ping. We follow
          # redirects with a cookie jar and a browser User-Agent so the request
          # actually reaches the app and registers as real traffic — a bare,
          # cookie-less request just bounces at the first redirect.
          jar="$(mktemp)"
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          code=$(curl -sSL --max-time 90 -c "$jar" -b "$jar" -A "$ua" \
                   -o /dev/null -w "%{http_code}" \
                   "$APP_URL/_stcore/health" || echo "000")
          echo "health endpoint (after session handshake) returned HTTP $code"
          # Also load the app root so the hit looks like a genuine view.
          curl -sSL --max-time 90 -c "$jar" -b "$jar" -A "$ua" -o /dev/null "$APP_URL/" || true
          if [ "$code" = "200" ]; then
            echo "App is awake and public."
          else
            echo "::warning::App health returned $code — if this persists, confirm the app is deployed and public."
          fi
