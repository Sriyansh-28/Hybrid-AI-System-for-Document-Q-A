name: Keep Render app awake

# Render's free tier puts a service to sleep after ~15 minutes of inactivity,
# showing a "waking up" page on the next visit. This workflow pings the
# Streamlit UI's health endpoint on a schedule so the instance stays warm and
# visitors land directly on the app.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch (main), so this takes effect once merged to main. Scheduled runs are
# best-effort and can be delayed a few minutes under load, so we ping every 5
# minutes to stay comfortably under the 15-minute sleep threshold.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit UI health endpoint
        run: |
          curl -fsS --max-time 90 \
            https://hybrid-ai-qa-ui.onrender.com/_stcore/health \
            && echo "UI is awake"
